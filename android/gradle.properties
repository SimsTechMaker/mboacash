# 4 GB is plenty for this project; the template's 8 GB starved a 16 GB PC and
# made the flutter tool crash ("Could not start thread DartWorker").
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The project is on D: and the pub cache on C:; Kotlin's incremental caches
# cannot relate paths across drives and crash, so compile plugins in full.
kotlin.incremental=false

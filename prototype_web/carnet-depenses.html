  async function makeStatement({ from, to, account, cats, plans }) {
    const jsPDF = await getJsPDF();
    const scope = account ? [account] : state.settings.accounts.map((a) => a.id);
    const inScope = new Set(scope);
    const effectOn = (t) => accountEffects(t).filter(([id]) => inScope.has(id)).reduce((s, [, v]) => s + v, 0);
    const order = (a, b) => a.date.localeCompare(b.date) || a.created - b.created;
    const txs = [...state.txs].sort(order);
    let opening = scope.reduce((s, id) => s + (accIdx[id]?.initial || 0), 0);
    for (const t of txs) if (t.date < from) opening += effectOn(t);
    const rows = [];
    let run = opening, debit = 0, credit = 0;
    for (const t of txs) {
      if (t.date < from || t.date > to) continue;
      const touches = accountEffects(t).some(([id]) => inScope.has(id));
      if (!touches) continue;
      const e = effectOn(t);
      run += e;
      if (e < 0) debit += -e; else credit += e;
      const v = txView(t);
      const accName = t.type === "transfer" ? `${accOf(accIdOf(t)).name} -> ${accOf(t.to).name}` : accIdOf(t) ? accOf(accIdOf(t)).name : "";
      const label = t.type === "transfer" ? (e === 0 ? "Transfert interne" : "Transfert") + (t.note ? ` - ${t.note}` : "") : (t.type === "in" || t.type === "out") ? (t.note || v.title) : v.title + (t.note ? ` - ${t.note}` : "");
      rows.push([t.date.split("-").reverse().join("/"), pdfText(label), pdfText(t.type === "in" || t.type === "out" ? catOf(t.cat).name : catOf(t.cat).name), pdfText(accName),
        e < 0 ? pm(-e) : "", e > 0 ? pm(e) : "", pm(run)]);
    }
    const period = txs.filter((t) => t.date >= from && t.date <= to && (t.type === "in" || t.type === "out") && inScope.has(accIdOf(t)));
    const { i, o } = sums(period);

    const doc = new jsPDF({ unit: "mm", format: "a4" });
    const W = doc.internal.pageSize.getWidth(), M = 14;
    const ACC = [29, 106, 86], INK = [20, 32, 27], MUT = [90, 105, 99], LINE = [210, 219, 215];
    const fmtD = (d) => pdfText(longDate(d));
    // Header band
    doc.setFillColor(...ACC); doc.rect(0, 0, W, 30, "F");
    doc.setTextColor(255); doc.setFont("helvetica", "bold"); doc.setFontSize(18);
    doc.text("Relevé de compte", M, 14);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
    doc.text(pdfText(`Du ${fmtD(from)} au ${fmtD(to)}`), M, 21);
    doc.text(pdfText(account ? accOf(account).name : "Tous les comptes"), M, 26);
    doc.setFontSize(9);
    doc.text(pdfText(`Carnet de dépenses`), W - M, 14, { align: "right" });
    doc.text(pdfText(`Édité le ${fmtD(today())}`), W - M, 21, { align: "right" });
    doc.text(pdfText(`Devise : ${state.settings.currency}`), W - M, 26, { align: "right" });

    // Summary boxes
    const boxes = [["Solde d'ouverture", pm(opening)], ["Total crédits", pm(credit)], ["Total débits", pm(debit)], ["Solde de clôture", pm(run)]];
    const bw = (W - 2 * M - 3 * 4) / 4;
    boxes.forEach(([l, v], k) => {
      const x = M + k * (bw + 4), y0 = 37;
      doc.setDrawColor(...LINE); doc.setFillColor(k === 3 ? 230 : 247, k === 3 ? 242 : 249, k === 3 ? 237 : 248);
      doc.roundedRect(x, y0, bw, 18, 2, 2, "FD");
      doc.setTextColor(...MUT); doc.setFontSize(7.5); doc.setFont("helvetica", "bold"); doc.text(pdfText(l.toUpperCase()), x + 3, y0 + 6);
      doc.setTextColor(...INK); doc.setFontSize(11); doc.text(v, x + 3, y0 + 13.5);
    });
    doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...MUT);
    doc.text(pdfText(`Revenus de la période : ${pm(i)}   ·   Dépenses de la période : ${pm(o)}   ·   ${rows.length} opération${rows.length > 1 ? "s" : ""}`), M, 62);

    const tableStyle = {
      theme: "grid", margin: { left: M, right: M, top: 16, bottom: 18 },
      styles: { font: "helvetica", fontSize: 8, cellPadding: 1.8, textColor: INK, lineColor: LINE, lineWidth: 0.2 },
      headStyles: { fillColor: ACC, textColor: 255, fontStyle: "bold" },
      alternateRowStyles: { fillColor: [247, 249, 248] },
    };
    doc.autoTable({
      ...tableStyle, startY: 66,
      head: [["Date", "Libellé", "Catégorie", "Compte", "Débit", "Crédit", "Solde"]],
      body: rows.length ? rows : [[{ content: "Aucune opération sur cette période.", colSpan: 7, styles: { halign: "center", textColor: MUT } }]],
      foot: rows.length ? [["", "Totaux", "", "", pm(debit), pm(credit), pm(run)]] : undefined,
      footStyles: { fillColor: [226, 232, 229], textColor: INK, fontStyle: "bold" },
      columnStyles: { 0: { cellWidth: 17 }, 1: { cellWidth: "auto" }, 2: { cellWidth: 22 }, 3: { cellWidth: 23 }, 4: { halign: "right", cellWidth: 26, textColor: [178, 63, 40] }, 5: { halign: "right", cellWidth: 26, textColor: [44, 122, 76] }, 6: { halign: "right", cellWidth: 27 } },
      didParseCell: (d) => { if (d.section !== "body") { if (d.column.index >= 4) d.cell.styles.halign = "right"; } },
    });
    let y = doc.lastAutoTable.finalY + 10;
    const section = (title) => {
      if (y > doc.internal.pageSize.getHeight() - 40) { doc.addPage(); y = 20; }
      doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(...INK); doc.text(pdfText(title), M, y); y += 3;
    };

    if (cats) {
      const by = {};
      for (const t of period) if (t.type === "out") by[t.cat] = (by[t.cat] || 0) + t.amount;
      const list = Object.entries(by).sort((a, b) => b[1] - a[1]);
      if (list.length) {
        section("Dépenses par catégorie");
        doc.autoTable({
          ...tableStyle, startY: y,
          head: [["Catégorie", "Montant", "Part", "Plafond mensuel"]],
          body: list.map(([id, v]) => [pdfText(catOf(id).name), pm(v), `${Math.round((v / o) * 100)} %`, catOf(id).cap ? pm(catOf(id).cap) : "-"]),
          foot: [["Total", pm(o), "100 %", ""]], footStyles: { fillColor: [226, 232, 229], textColor: INK, fontStyle: "bold" },
          columnStyles: { 1: { halign: "right" }, 2: { halign: "right" }, 3: { halign: "right" } },
          didParseCell: (d) => { if (d.section !== "body" && d.column.index >= 1) d.cell.styles.halign = "right"; },
        });
        y = doc.lastAutoTable.finalY + 10;
      }
    }
    if (plans && !account) {
      if (state.plans.goals.length) {
        section("Épargne");
        doc.autoTable({
          ...tableStyle, startY: y,
          head: [["Objectif", "Épargné", "Cible", "Avancement", "Date visée"]],
          body: state.plans.goals.map((g) => { const s = goalSaved(g); return [pdfText(g.name), pm(s), g.target ? pm(g.target) : "-", g.target ? `${Math.min(100, Math.round((s / g.target) * 100))} %` : "-", g.deadline ? fmtD(g.deadline) : "-"]; }),
          columnStyles: { 1: { halign: "right" }, 2: { halign: "right" }, 3: { halign: "right" } },
        });
        y = doc.lastAutoTable.finalY + 10;
      }
      if (state.plans.debts.length) {
        section("Dettes et prêts");
        doc.autoTable({
          ...tableStyle, startY: y,
          head: [["Personne", "Sens", "Montant", "Remboursé", "Reste", "Échéance"]],
          body: state.plans.debts.map((d) => { const left = debtLeft(d); return [pdfText(d.person), d.kind === "owe" ? "Je dois" : "On me doit", pm(d.amount), pm(d.amount - left), left > 0 ? pm(left) : "Soldée", d.due ? fmtD(d.due) : "-"]; }),
          columnStyles: { 2: { halign: "right" }, 3: { halign: "right" }, 4: { halign: "right" } },
        });
      }
    }
    // Footer on every page
    const pages = doc.getNumberOfPages(), H = doc.internal.pageSize.getHeight();
    for (let p = 1; p <= pages; p++) {
      doc.setPage(p);
      doc.setDrawColor(...LINE); doc.line(M, H - 12, W - M, H - 12);
      doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...MUT);
      doc.text(pdfText(`Relevé du ${fmtD(from)} au ${fmtD(to)} - document personnel, sans valeur bancaire officielle`), M, H - 7);
      doc.text(`Page ${p} / ${pages}`, W - M, H - 7, { align: "right" });
    }

    const filename = `releve-${from}-au-${to}${account ? "-" + accOf(account).name.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g, "-") : ""}.pdf`;
    const dl = window.claude?.use ? await window.claude.use("downloads") : null;
    if (dl) {
      try { await dl.save({ filename, data: doc.output("blob") }); toast("Relevé enregistré"); }
      catch (e) { if (e?.code !== "declined") toast("Le téléchargement n'est pas disponible dans cette vue."); }
      return;
    }
    toast("Le téléchargement n'est pas disponible dans cette vue.");
  }

  // ---------- data actions ----------
  async function exportCsv() {
    const rows = [["date", "type", "categorie", "compte", "vers_compte", "montant", "devise", "note"]];
    const TYPE = { in: "revenu", out: "depense", transfer: "transfert", adjust: "ajustement", save: "epargne", debt: "dette" };
    [...state.txs].sort((a, b) => a.date.localeCompare(b.date)).forEach((t) => {
      const v = txView(t);
      const signed = t.type === "out" ? -t.amount : t.type === "in" || t.type === "transfer" ? t.amount : t.dir * t.amount;
      rows.push([t.date, TYPE[t.type], v.title, accIdOf(t) ? accOf(accIdOf(t)).name : "", t.type === "transfer" ? accOf(t.to).name : "", String(signed), state.settings.currency, t.note]);
    });
    const csv = "﻿" + rows.map((r) => r.map((v) => /[";\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v).join(";")).join("\n");
    const dl = window.claude?.use ? await window.claude.use("downloads") : null;
    if (dl) {
      try { await dl.save({ filename: `carnet-depenses-${today()}.csv`, data: csv }); toast("Fichier enregistré"); return; }
      catch (e) { if (e?.code === "declined") return; }
    }
    try { await navigator.clipboard.writeText(csv); toast("CSV copié dans le presse-papiers"); }
    catch (e) { toast("Export indisponible dans cette vue."); }
  }
  async function clearSamples() {
    const ids = state.txs.filter((t) => t.sample).map((t) => t.id);
    for (const id of ids) { try { await store.deleteTx(id); } catch (e) { return; } }
    if (state.plans.goals.some((g) => g.sample) || state.plans.debts.some((d) => d.sample)) {
      try { await store.savePlans({ goals: state.plans.goals.filter((g) => !g.sample), debts: state.plans.debts.filter((d) => !d.sample) }); } catch (e) { return; }
    }
    if (draft) renderSheet();
    toast("Exemples retirés");
  }
  async function loadSamples() {
    const now = new Date();
    const A = (id) => accIdx[id] && !accIdx[id].archived ? id : state.settings.defaultAccount;
    const C = (id, type) => catIdx[id] && !catIdx[id].archived ? id : activeCats(type)[0].id;
    const goalId = "g-" + newId(), debtA = "d-" + newId(), debtB = "d-" + newId();
    const d0 = (mBack, day) => isoDate(new Date(now.getFullYear(), now.getMonth() - mBack, Math.min(day, now.getDate())));
    const plans = {
      goals: [...state.plans.goals, { id: goalId, name: "Fonds d'urgence", icon: "shield", color: "--c2", target: 600000, initial: 0, deadline: isoDate(new Date(now.getFullYear(), now.getMonth() + 8, 1)), sample: true, created: Date.now() }],
      debts: [...state.plans.debts,
        { id: debtA, kind: "lent", person: "Moussa", amount: 50000, date: d0(1, 10), due: isoDate(new Date(now.getFullYear(), now.getMonth(), 1)), note: "Avance pour son loyer", sample: true, created: Date.now() },
        { id: debtB, kind: "owe", person: "Tontine du quartier", amount: 120000, date: d0(2, 5), due: isoDate(new Date(now.getFullYear(), now.getMonth() + 3, 1)), note: "", sample: true, created: Date.now() }],
    };
    try { await store.savePlans(plans); } catch (e) { return; }
    const plan = [
      [0, 1, "in", "salaire", 450000, "Salaire", "bank"], [0, 2, "out", "logement", 150000, "Loyer", "bank"],
      [0, 3, "transfer", "", 60000, "Retrait au guichet", "bank", "cash"],
      [0, 3, "out", "alim", 18500, "Marché de la semaine", "cash"], [0, 4, "out", "transport", 3500, "Taxi compteur", "cash"],
      [0, 5, "transfer", "", 30000, "Recharge", "bank", "momo"], [0, 5, "save", "", 50000, "", "bank"],
      [0, 6, "out", "factures", 22000, "Électricité", "momo"], [0, 8, "out", "alim", 9200, "Supermarché", "cash"],
      [0, 9, "out", "resto", 6500, "Déjeuner au maquis", "cash"], [0, 10, "debt", "", 20000, "", "momo", "", debtB, "pay"],
      [0, 12, "out", "loisirs", 12000, "Cinéma et sortie", "cash"], [0, 13, "out", "sante", 7500, "Pharmacie", "cash"],
      [0, 14, "in", "activite", 85000, "Mission freelance", "momo"], [0, 15, "out", "famille", 25000, "Aide aux parents", "momo"],
      [0, 16, "debt", "", 20000, "", "cash", "", debtA, "pay"],
      [0, 18, "out", "transport", 15000, "Carburant", "cash"], [0, 20, "out", "shopping", 19900, "Chaussures", "bank"],
      [0, 22, "out", "telephone", 10000, "Forfait internet", "momo"], [0, 24, "out", "education", 30000, "Cours d'anglais", "bank"],
      [1, 1, "in", "salaire", 450000, "Salaire", "bank"], [1, 2, "out", "logement", 150000, "Loyer", "bank"],
      [1, 3, "transfer", "", 120000, "Retrait au guichet", "bank", "cash"], [1, 5, "save", "", 75000, "", "bank"],
      [1, 6, "out", "alim", 61000, "Courses du mois", "cash"], [1, 10, "debt", "", 50000, "", "cash", "", debtA, "init"],
      [1, 12, "out", "factures", 31000, "Électricité et eau", "momo"], [1, 19, "out", "transport", 28000, "Carburant", "cash"],
      [1, 25, "out", "loisirs", 22000, "Week-end", "bank"],
      [2, 1, "in", "salaire", 450000, "Salaire", "bank"], [2, 2, "out", "logement", 150000, "Loyer", "bank"],
      [2, 3, "transfer", "", 120000, "Retrait au guichet", "bank", "cash"], [2, 5, "debt", "", 120000, "", "bank", "", debtB, "init"],
      [2, 9, "out", "alim", 72000, "Courses du mois", "cash"], [2, 16, "out", "sante", 40000, "Consultation", "bank"],
      [2, 22, "out", "shopping", 55000, "Téléphone", "bank"],
    ];
    let n = 0;
    for (const [mBack, day, type, cat, amount, note, acc, to, debt, role] of plan) {
      if (mBack === 0 && day > now.getDate()) continue;
      const account = A(acc);
      const toAcc = type === "transfer" ? A(to) : "";
      if (type === "transfer" && toAcc === account) continue;
      const d = plans.debts.find((x) => x.id === debt);
      const dir = type === "save" ? -1 : type === "debt" ? (d.kind === "owe" ? (role === "init" ? 1 : -1) : (role === "init" ? -1 : 1)) : 1;
      const tx = { id: newId(), type, amount, cat: type === "in" || type === "out" ? C(cat, type) : type, account, to: toAcc, dir, goal: type === "save" ? goalId : "", debt: debt || "", role: role || "pay", date: isoDate(new Date(now.getFullYear(), now.getMonth() - mBack, day)), note, sample: true, created: Date.now() + n++ };
      try { await store.saveTx(tx); } catch (e) { break; }
    }
    state.month = monthKey(now); render();
    toast("Exemples chargés. Tu pourras les retirer dans Paramètres › Données.");
  }

  // ---------- boot ----------
  function staticIcons() {
    $("prev").innerHTML = ico("chevron-left"); $("next").innerHTML = ico("chevron-right");
    $("open-settings").innerHTML = ico("settings");
    $("add-desktop").innerHTML = ico("plus") + "Nouvelle opération";
    $("fab").innerHTML = ico("plus");
    $("back").innerHTML = ico("chevron-left") + "Plus";
    for (const b of document.querySelectorAll("[data-close], #sheet-close, #picker-close")) if (b.classList.contains("icon-btn")) b.innerHTML = ico("x");
  }
  function setMode() {
    const m = $("mode");
    m.classList.toggle("sync", store.mode === "sync");
    m.querySelector("span").textContent = store.mode === "sync" ? "Synchronisé avec ton compte" : "Enregistré sur cet appareil";
  }
  staticIcons();
  setSettings({ theme: savedTheme });
  render();
  (async () => {
    let remote = null;
    try { remote = await remoteStore(); } catch (e) { remote = null; }
    store = remote || localStore();
    setMode(); render();
  })();
})();
</script>

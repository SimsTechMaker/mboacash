<style>
/* Layout: personal finance app. Sidebar nav on desktop, bottom tab bar on phones; five views (operations, accounts, categories, stats, more) under one top bar; forms open in sheets. */
:root {
  --bg: #EDF1EF;
  --surface: #FFFFFF;
  --surface-2: #E2E8E5;
  --ink: #14201B;
  --muted: #5A6963;
  --line: #D2DBD7;
  --accent: #1D6A56;
  --accent-ink: #FFFFFF;
  --accent-soft: #D3E8E0;
  --out: #B23F28;
  --in: #2C7A4C;
  --warn: #A86A12;
  --scrim: rgb(10 20 16 / 0.45);
  --c1: #D9822B; --c2: #3A78B5; --c3: #7A5BB0; --c4: #C2453B; --c5: #2E9C8F;
  --c6: #D4A72C; --c7: #C25A8C; --c8: #4F8A3A; --c9: #8C6A4A; --c10: #7D8A86;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 12px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1513; --surface: #172019; --surface-2: #212C27; --ink: #E5ECE8; --muted: #93A39C;
    --line: #2A3631; --accent: #5CC2A3; --accent-ink: #0B1612; --accent-soft: #1D3B32;
    --out: #EE8A72; --in: #78D19B; --warn: #E3B256; --scrim: rgb(0 0 0 / 0.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1513; --surface: #172019; --surface-2: #212C27; --ink: #E5ECE8; --muted: #93A39C;
  --line: #2A3631; --accent: #5CC2A3; --accent-ink: #0B1612; --accent-soft: #1D3B32;
  --out: #EE8A72; --in: #78D19B; --warn: #E3B256; --scrim: rgb(0 0 0 / 0.6); color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h1 { font-size: 1.55rem; letter-spacing: -0.01em; }
h2 { font-size: 1.05rem; font-weight: 600; }
h3 { font-size: 0.95rem; font-weight: 600; }
p { margin: 0; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.ico { width: 1.15em; height: 1.15em; flex: none; display: block; }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.note { font-size: 0.85rem; color: var(--muted); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pos { color: var(--in); } .neg { color: var(--out); } .neutral { color: var(--muted); }

/* App shell */
.app { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 28px; align-items: start; }
.tabbar { position: sticky; top: 20px; display: grid; gap: 4px; }
.tabbar .brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; padding: 4px 10px 18px; }
.tabbar .brand span { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.tab { display: flex; align-items: center; gap: 12px; border: 0; background: transparent; padding: 10px 12px; border-radius: 10px; font-weight: 500; color: var(--muted); text-align: left; }
.tab .ico { width: 20px; height: 20px; }
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.content { display: grid; gap: 20px; min-width: 0; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; }
.titleblock { display: grid; gap: 2px; min-width: 0; }
.titleblock .back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 0.85rem; }
.titleblock .back .ico { width: 16px; height: 16px; }
.mode { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.mode i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.mode.sync i { background: var(--in); }
.tools { display: flex; align-items: center; gap: 8px; }
.monthnav { display: flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.monthnav button { border: 0; background: transparent; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
.monthnav button:hover { background: var(--surface-2); }
.monthnav strong { min-width: 8.6em; text-align: center; font-family: var(--f-display); font-weight: 600; text-transform: capitalize; }
.round { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.round:hover { background: var(--surface-2); }
.fab { position: fixed; z-index: 41; right: max(20px, calc(env(safe-area-inset-right, 0px) + 16px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); width: 58px; height: 58px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-ink); display: none; place-items: center; box-shadow: 0 8px 24px rgb(0 0 0 / .25); }
.fab .ico { width: 26px; height: 26px; }
.view { display: grid; gap: 20px; min-width: 0; }

/* Cards and controls */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 9px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn .ico { width: 17px; height: 17px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--out); }
.btn.danger.armed { background: var(--out); color: var(--surface); border-color: var(--out); }
.btn.small { padding: 6px 12px; font-size: 0.85rem; }
.btn.grow { flex: 1; }
.linkish { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; font-size: 0.85rem; display: inline-flex; gap: 4px; align-items: center; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 9px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 8px; border-radius: 7px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.seg button[data-type="out"][aria-pressed="true"] { color: var(--out); }
.seg button[data-type="in"][aria-pressed="true"] { color: var(--in); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; align-content: start; }
.field.wide { grid-column: 1 / -1; }
.field label, .field .flabel { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-width: 0; }
input.big { font-family: var(--f-num); font-size: 1.15rem; }
.cats { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px 5px 9px; font-size: 0.86rem; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip .ico { width: 16px; height: 16px; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--surface-2); font-weight: 600; }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.filters .chip { flex: none; }
.pill { font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.over { background: color-mix(in srgb, var(--out) 18%, transparent); color: var(--out); }
.pill.muted { background: var(--surface-2); color: var(--muted); }
.gauge { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.gauge > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .3s; }
.gauge.warn > span { background: var(--warn); } .gauge.over > span { background: var(--out); } .gauge.good > span { background: var(--in); }
.badge { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; flex: none; }
.badge .ico { width: 20px; height: 20px; }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty p { max-width: 36ch; }
.empty .ico { width: 30px; height: 30px; color: var(--accent); }

/* Totals */
.totals { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.total { background: var(--surface); padding: 16px 18px; display: grid; gap: 4px; min-width: 0; }
.total .num { font-size: clamp(1rem, 4.2vw, 1.3rem); overflow-wrap: break-word; }
.total.hero .num { font-size: 1.65rem; }
.budget { grid-column: 1 / -1; background: var(--surface); padding: 12px 18px 16px; display: grid; gap: 8px; }
.row-between { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 0.9rem; }

/* Journal */
.day { display: grid; gap: 2px; }
.day-head { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); padding: 10px 2px 4px; border-bottom: 1px solid var(--line); text-transform: capitalize; }
.tx { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 6px; border-radius: 9px; border: 0; background: transparent; text-align: left; width: 100%; }
.tx:hover { background: var(--surface-2); }
.what { display: grid; min-width: 0; }
.what b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.what span { color: var(--muted); font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.amt { font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { font-size: 0.66rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--warn); margin-left: 6px; }

/* Lists of cards (accounts, categories, goals, debts) */
.list { display: grid; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; min-width: 0; }
button.item { text-align: left; width: 100%; }
button.item:hover { border-color: var(--muted); }
.item .badge { grid-row: span 2; }
.item .item-sub { grid-column: 2 / -1; display: grid; gap: 6px; }
.item .item-actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; padding-top: 6px; border-top: 1px solid var(--line); margin-top: 4px; }
.worth { display: grid; gap: 10px; }
.worth .num.big { font-size: clamp(1.4rem, 7vw, 1.9rem); }
.worth-rows { display: grid; gap: 6px; font-size: 0.9rem; }
.worth-rows div { display: flex; justify-content: space-between; gap: 10px; }
.menu { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.menu button { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 14px 16px; border: 0; background: var(--surface); text-align: left; }
.menu button:hover { background: var(--surface-2); }
.menu .chev { color: var(--muted); }

/* Charts */
.donut-wrap { display: grid; gap: 18px; justify-items: center; }
.donut-wrap svg { width: 100%; max-width: 180px; height: auto; }
.legend { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; width: 100%; }
.legend li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 0.88rem; }
.legend li .ico { width: 18px; height: 18px; }
.legend .bar { grid-column: 2 / -1; height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.legend .bar span { display: block; height: 100%; }
.legend small { color: var(--muted); }
.trend svg { width: 100%; height: auto; display: block; }
.key { display: flex; gap: 14px; font-size: 0.8rem; color: var(--muted); }
.key span { display: inline-flex; align-items: center; gap: 6px; }
.key i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; min-width: 0; }
.kpi .num { font-size: clamp(0.95rem, 4vw, 1.15rem); overflow-wrap: break-word; }

/* Sheets and modals */
.sheet { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: grid; place-items: center; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
#modal { z-index: 55; }
.sheet-card { background: var(--surface); color: var(--ink); width: min(560px, 100%); max-height: 100%; border-radius: 16px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; box-shadow: 0 20px 60px rgb(0 0 0 / .3); }
.sheet-card.wide { width: min(820px, 100%); }

.icon-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid transparent; background: transparent; display: grid; place-items: center; color: var(--muted); flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

.sheet-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.sheet-foot .spacer { flex: 1; }
.sheet-mid { display: grid; grid-template-columns: 190px minmax(0, 1fr); min-height: 0; }
.sheet-nav { border-right: 1px solid var(--line); padding: 10px; display: grid; align-content: start; gap: 2px; overflow-y: auto; }
.sheet-nav button { border: 0; background: transparent; text-align: left; padding: 9px 10px; border-radius: 8px; display: flex; gap: 10px; align-items: center; font-weight: 500; white-space: nowrap; }

.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 44px minmax(0, 1fr) minmax(0, 0.7fr) auto; gap: 8px; align-items: center; }
.row.no-cap { grid-template-columns: 44px minmax(0, 1fr) auto; }

.emo-btn { width: 44px; height: 42px; border-radius: 9px; border: 1px solid var(--line); display: grid; place-items: center; }
.emo-btn .ico { width: 21px; height: 21px; }

.radio input { width: auto; }
.info { background: var(--surface-2); border-radius: 10px; padding: 14px; display: grid; gap: 6px; font-size: 0.9rem; }
.picker { position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
.picker-card { background: var(--surface); border-radius: 14px; width: min(420px, 100%); padding: 16px; display: grid; gap: 12px; box-shadow: 0 20px 60px rgb(0 0 0 / .3); max-height: 100%; overflow-y: auto; }
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 4px; }
.icon-grid button { border: 0; background: transparent; border-radius: 8px; height: 44px; display: grid; place-items: center; color: var(--ink); }
.icon-grid button .ico { width: 22px; height: 22px; }
.icon-grid button:hover, .icon-grid button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.toast { position: fixed; z-index: 80; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 0.9rem; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); }

@media (max-width: 960px) {

}

  }

<div class="app">
  <nav class="tabbar" id="tabbar" aria-label="Navigation principale"></nav>

  <main class="content">
    <header class="topbar">
      <div class="titleblock">
        <button type="button" class="back" id="back" hidden></button>
        <h1 id="view-title">Opérations</h1>
        <div class="mode" id="mode"><i></i><span>Chargement…</span></div>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
(() => {
  const DEFAULT_CATS = [
    ["alim", "Alimentation", "shopping-cart", "out", "--c1"], ["resto", "Restaurant", "utensils", "out", "--c6"],
    ["transport", "Transport", "car", "out", "--c2"], ["logement", "Logement", "house", "out", "--c3"],
    ["factures", "Factures", "lightbulb", "out", "--c4"], ["telephone", "Téléphone et internet", "wifi", "out", "--c5"],
    ["sante", "Santé", "pill", "out", "--c5"], ["loisirs", "Loisirs", "film", "out", "--c6"],
    ["shopping", "Shopping", "shopping-bag", "out", "--c7"], ["education", "Éducation", "graduation-cap", "out", "--c8"],
    ["famille", "Famille", "users", "out", "--c9"], ["autre", "Autre", "package", "out", "--c10"],
    ["salaire", "Salaire", "briefcase", "in", "--c8"], ["activite", "Activité", "hand-coins", "in", "--c2"],
    ["cadeau", "Cadeau", "gift", "in", "--c6"], ["autre_in", "Autre revenu", "coins", "in", "--c10"],
  ].map(([id, name, icon, type, color]) => ({ id, name, icon, type, color, cap: 0, archived: false }));
  const DEFAULT_ACCOUNTS = [
    { id: "cash", name: "Espèces", icon: "wallet", initial: 0, archived: false },
    { id: "bank", name: "Banque", icon: "landmark", initial: 0, archived: false },
    { id: "momo", name: "Mobile Money", icon: "smartphone", initial: 0, archived: false },
  ];
  const ICONS = ["shopping-cart","shopping-basket","utensils","coffee","pizza","apple","beer","wine","car","bus","bike","fuel","plane","train-front","ship","house","building","key","lightbulb","droplet","flame","zap","wifi","smartphone","laptop","tv","pill","stethoscope","heart-pulse","hospital","glasses","film","gamepad-2","music","dumbbell","ticket","shopping-bag","shirt","footprints","scissors","sparkles","book-open","graduation-cap","pencil","baby","users","dog","cat","gift","party-popper","heart","church","briefcase","banknote","coins","hand-coins","wallet","landmark","credit-card","piggy-bank","trending-up","receipt","wrench","hammer","paintbrush","plug","package","umbrella","tree-palm","sun","leaf","shield","scale","phone","mail","calendar","smile","star","trophy","flower-2"];
  const GOAL_ICONS = ["piggy-bank", "shield", "house", "car", "plane", "graduation-cap", "laptop", "heart", "gift", "tree-palm", "baby", "star"];
  // Old versions stored emoji; map them to the matching icon.
  const EMOJI_ICON = { "🛒": "shopping-cart", "🍽️": "utensils", "🚕": "car", "🏠": "house", "💡": "lightbulb", "📶": "wifi", "💊": "pill", "🎬": "film", "🛍️": "shopping-bag", "📚": "graduation-cap", "👨‍👩‍👧": "users", "📦": "package", "💼": "briefcase", "💰": "hand-coins", "🎁": "gift", "🪙": "coins", "💵": "wallet", "🏦": "landmark", "📱": "smartphone", "💳": "credit-card", "✨": "sparkles" };
  const PALETTE = ["--c1","--c2","--c3","--c4","--c5","--c6","--c7","--c8","--c9","--c10"];
  const CURRENCIES = [["XOF","Franc CFA (XOF)"],["XAF","Franc CFA (XAF)"],["EUR","Euro (EUR)"],["USD","Dollar US (USD)"],["MAD","Dirham marocain (MAD)"],["GNF","Franc guinéen (GNF)"],["NGN","Naira (NGN)"],["GHS","Cedi (GHS)"]];
  const ZERO_DEC = ["XOF", "XAF", "GNF"];
  const TX_TYPES = ["in", "out", "transfer", "adjust", "save", "debt"];
  const LS_KEY = "carnet-depenses-v1";
  const LS_THEME = "carnet-theme";
  const VIEWS = [
    ["ops", "list", "Opérations"], ["accounts", "wallet", "Comptes"], ["cats", "tags", "Catégories"],
    ["stats", "chart-pie", "Statistiques"], ["more", "layout-grid", "Plus"],
  ];
  const SUBVIEWS = { savings: "Épargne", debts: "Dettes" };

  const $ = (id) => document.getElementById(id);
  const state = {
    txs: [], settings: null, plans: { goals: [], debts: [] },
    view: "ops", month: monthKey(new Date()), type: "out", cat: "alim", filter: null, accFilter: null, editing: null,
    catView: "out", debtView: "owe",
  };
  let store = null; // { mode, saveTx, deleteTx, saveSettings, savePlans }
  let catIdx = {}, accIdx = {};

  // ---------- helpers ----------
  function pad(n) { return String(n).padStart(2, "0"); }
  function isoDate(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function monthKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }
  function shiftMonth(key, delta) { const [y, m] = key.split("-").map(Number); return monthKey(new Date(y, m - 1 + delta, 1)); }
  function monthName(key, opts = { month: "long", year: "numeric" }) { const [y, m] = key.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString("fr-FR", opts); }
  function longDate(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }); }
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function parseAmount(v) { const n = parseFloat(String(v).replace(/[\s  ]/g, "").replace(",", ".")); return isFinite(n) ? n : NaN; }
  const today = () => isoDate(new Date());
  let fmtCache = {};
  function money(n, signed) {
    const cur = state.settings.currency || "XOF";
    const zero = ZERO_DEC.includes(cur);
    let f = fmtCache[cur];
    if (!f) { try { f = new Intl.NumberFormat("fr-FR", { style: "currency", currency: cur, maximumFractionDigits: zero ? 0 : 2, minimumFractionDigits: zero ? 0 : 2 }); } catch (e) { f = new Intl.NumberFormat("fr-FR"); } fmtCache[cur] = f; }
    const s = f.format(Math.abs(n));
    if (!signed) return n < 0 ? "−" + s : s;
    return (n < 0 ? "−" : "+") + s;
  }
  function compact(n) { return new Intl.NumberFormat("fr-FR", { notation: "compact", maximumFractionDigits: 1 }).format(n); }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  let toastTimer;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600); }
  const tint = (color) => `background:color-mix(in srgb, var(${color}) 16%, var(--surface));color:var(${color})`;
  const plural = (n, w) => `${n} ${w}${n > 1 ? "s" : ""}`;

  // ---------- icons (Lucide, drawn inline) ----------
  const pascal = (n) => String(n).split("-").map((s) => s.charAt(0).toUpperCase() + s.slice(1)).join("");
  const kebab = (n) => n.replace(/([a-z0-9])([A-Z])/g, "$1-$2").replace(/([a-zA-Z])([0-9])/g, "$1-$2").toLowerCase();
  const iconNode = (name) => window.lucide?.icons?.[pascal(name)];
  const hasIcon = (name) => Array.isArray(iconNode(name));
  const iconCache = {};
  function ico(name) {
    if (iconCache[name] === undefined) {
      const node = iconNode(name);
      const kids = Array.isArray(node) ? (node[0] === "svg" ? node[2] : node) : null;
      iconCache[name] = Array.isArray(kids)
        ? kids.map(([tag, attrs]) => `<${tag} ${Object.entries(attrs || {}).map(([k, v]) => `${k}="${esc(v)}"`).join(" ")}/>`).join("")
        : null;
    }
    const inner = iconCache[name] || '<circle cx="12" cy="12" r="8"/>';
    return `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
  }
  const validIcon = (v) => typeof v === "string" && /^[a-z0-9-]{1,48}$/.test(v) ? v : "";

  // ---------- settings & plans model ----------
  function normSettings(raw) {
    const s = raw && typeof raw === "object" ? raw : {};
    const out = {
      currency: CURRENCIES.some((c) => c[0] === s.currency) ? s.currency : "XOF",
      budget: Number(s.budget) > 0 ? Number(s.budget) : 0,
      theme: ["auto", "light", "dark"].includes(s.theme) ? s.theme : "auto",
    };
    const oldCaps = s.catBudgets || {};
    const cats = Array.isArray(s.cats) && s.cats.length ? s.cats : DEFAULT_CATS.map((c) => ({ ...c, cap: Number(oldCaps[c.id]) || 0 }));
    out.cats = cats.filter((c) => c && c.id && c.name).map((c) => ({
      id: String(c.id).slice(0, 40), name: String(c.name).slice(0, 40),
      icon: validIcon(c.icon) || EMOJI_ICON[c.emoji] || DEFAULT_CATS.find((d) => d.id === c.id)?.icon || "tag",
      type: c.type === "in" ? "in" : "out", color: PALETTE.includes(c.color) ? c.color : "--c10",
      cap: Number(c.cap) > 0 ? Number(c.cap) : 0, archived: !!c.archived,
    }));
    for (const t of ["out", "in"]) if (!out.cats.some((c) => c.type === t && !c.archived)) out.cats.push(...DEFAULT_CATS.filter((c) => c.type === t && !out.cats.some((x) => x.id === c.id)));
    const accs = Array.isArray(s.accounts) && s.accounts.length ? s.accounts : DEFAULT_ACCOUNTS;
    out.accounts = accs.filter((a) => a && a.id && a.name).map((a) => ({
      id: String(a.id).slice(0, 40), name: String(a.name).slice(0, 40),
      icon: validIcon(a.icon) || EMOJI_ICON[a.emoji] || DEFAULT_ACCOUNTS.find((d) => d.id === a.id)?.icon || "credit-card",
      initial: Number(a.initial) || 0, archived: !!a.archived,
    }));
    if (!out.accounts.some((a) => !a.archived)) out.accounts.push({ ...DEFAULT_ACCOUNTS[0], id: "cash-" + newId() });
    const active = out.accounts.filter((a) => !a.archived);
    out.defaultAccount = active.some((a) => a.id === s.defaultAccount) ? s.defaultAccount : active[0].id;
    return out;
  }
  function setSettings(raw) {
    state.settings = normSettings(raw);
    catIdx = {}; for (const c of state.settings.cats) catIdx[c.id] = c;
    accIdx = {}; for (const a of state.settings.accounts) accIdx[a.id] = a;
    fmtCache = {};
    applyTheme(state.settings.theme);
  }
  function normPlans(raw) {
    const p = raw && typeof raw === "object" ? raw : {};
    const goals = (Array.isArray(p.goals) ? p.goals : []).filter((g) => g && g.id && g.name).map((g) => ({
      id: String(g.id), name: String(g.name).slice(0, 60), icon: validIcon(g.icon) || "piggy-bank",
      color: PALETTE.includes(g.color) ? g.color : "--c2", target: Number(g.target) > 0 ? Number(g.target) : 0,
      initial: Number(g.initial) > 0 ? Number(g.initial) : 0, deadline: /^\d{4}-\d{2}-\d{2}$/.test(g.deadline || "") ? g.deadline : "",
      sample: !!g.sample, created: Number(g.created) || 0,
    }));
    const debts = (Array.isArray(p.debts) ? p.debts : []).filter((d) => d && d.id && d.person).map((d) => ({
      id: String(d.id), kind: d.kind === "lent" ? "lent" : "owe", person: String(d.person).slice(0, 60),
      amount: Number(d.amount) > 0 ? Number(d.amount) : 0, date: /^\d{4}-\d{2}-\d{2}$/.test(d.date || "") ? d.date : today(),
      due: /^\d{4}-\d{2}-\d{2}$/.test(d.due || "") ? d.due : "", note: String(d.note || "").slice(0, 120),
      sample: !!d.sample, created: Number(d.created) || 0,
    }));
    return { goals, debts };
  }
  const activeCats = (type) => state.settings.cats.filter((c) => c.type === type && !c.archived);
  const activeAccs = () => state.settings.accounts.filter((a) => !a.archived);
  const SPECIAL = {
    transfer: { name: "Transfert", icon: "arrow-left-right" }, adjust: { name: "Ajustement", icon: "sliders-horizontal" },
    save: { name: "Épargne", icon: "piggy-bank" }, debt: { name: "Dette", icon: "handshake" },
  };
  function catOf(id) {
    if (SPECIAL[id]) return { id, color: "--c10", type: id, ...SPECIAL[id] };
    return catIdx[id] || { id, name: "Sans catégorie", icon: "package", color: "--c10", type: "out" };
  }
  function accOf(id) { return accIdx[id] || accIdx[state.settings.defaultAccount] || { id: "?", name: "Compte supprimé", icon: "circle-help" }; }
  function accIdOf(t) {
    if (t.type === "debt" && !t.account) return "";
    return accIdx[t.account] ? t.account : state.settings.defaultAccount;
  }
  const goalOf = (id) => state.plans.goals.find((g) => g.id === id);
  const debtOf = (id) => state.plans.debts.find((d) => d.id === id);

  let themeSetByUs = false;
  function applyTheme(t) {
    try { localStorage.setItem(LS_THEME, t); } catch (e) {}
    const r = document.documentElement;
    if (t === "light" || t === "dark") { r.setAttribute("data-theme", t); themeSetByUs = true; }
    else if (themeSetByUs) { r.removeAttribute("data-theme"); themeSetByUs = false; }
  }
  let savedTheme = "auto";
  try { const t = localStorage.getItem(LS_THEME); if (t === "light" || t === "dark") savedTheme = t; } catch (e) {}

  function cleanTx(d, id) {
    const amount = Number(d.amount);
    const type = TX_TYPES.includes(d.type) ? d.type : "out";
    if (!isFinite(amount) || amount <= 0 || !/^\d{4}-\d{2}-\d{2}$/.test(d.date || "")) return null;
    return {
      id, type, amount, cat: type === "in" || type === "out" ? String(d.cat || "autre") : type,
      account: d.account ? String(d.account) : "", to: type === "transfer" ? String(d.to || "") : "",
      dir: Number(d.dir) === -1 ? -1 : 1, goal: String(d.goal || ""), debt: String(d.debt || ""), role: d.role === "init" ? "init" : "pay",
      date: d.date, note: String(d.note || "").slice(0, 120), sample: !!d.sample, created: Number(d.created) || 0,
    };
  }

  // ---------- storage ----------
  function localStore() {
    function persist() { try { localStorage.setItem(LS_KEY, JSON.stringify({ txs: state.txs, settings: state.settings, plans: state.plans })); } catch (e) {} }
    try {
      const raw = JSON.parse(localStorage.getItem(LS_KEY) || "null");
      if (raw) {
        state.txs = (raw.txs || []).map((t) => cleanTx(t, t.id)).filter(Boolean);
        setSettings(raw.settings);
        state.plans = normPlans(raw.plans);
      }
    } catch (e) {}
    return {
      mode: "local",
      async saveTx(tx) { const i = state.txs.findIndex((t) => t.id === tx.id); i >= 0 ? (state.txs[i] = tx) : state.txs.push(tx); persist(); render(); },
      async deleteTx(id) { state.txs = state.txs.filter((t) => t.id !== id); persist(); render(); },
      async saveSettings(s) { setSettings(s); persist(); render(); },
      async savePlans(p) { state.plans = normPlans(p); persist(); render(); },
    };
  }

  async function remoteStore() {
    const c = window.claude;
    if (!c || typeof c.use !== "function") return null;
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    if (!db || !user) return null;
    const uid = await user.id();
    if (!uid) return null;
    const base = `data/users/${uid}`;
    const col = db.doc(`${base}/ledger`).collection("tx");
    const settingsRef = db.doc(`${base}/settings`);
    const plansRef = db.doc(`${base}/plans`);
    col.onSnapshot((snap) => {
      state.txs = snap.docs.map((d) => cleanTx(d.data() || {}, d.id)).filter(Boolean);
      render();
    }, () => toast("La synchronisation s'est arrêtée. Recharge la page."));
    settingsRef.onSnapshot((snap) => { if (snap.exists) { setSettings(snap.data()); render(); } }, () => {});
    plansRef.onSnapshot((snap) => { if (snap.exists) { state.plans = normPlans(snap.data()); render(); } }, () => {});
    const fail = (e) => {
      toast(e && e.code === "quota_exceeded" ? "Espace plein : supprime d'anciennes opérations." : "Enregistrement impossible. Vérifie ta connexion.");
      throw e;
    };
    return {
      mode: "sync",
      saveTx: (tx) => { const { id, ...body } = tx; return col.doc(id).set(body).catch(fail); },
      deleteTx: (id) => col.doc(id).delete().catch(fail),
      saveSettings: (s) => settingsRef.set(s).then(() => { setSettings(s); render(); }).catch(fail),
      savePlans: (p) => { const n = normPlans(p); return plansRef.set(n).then(() => { state.plans = n; render(); }).catch(fail); },
    };
  }

  // ---------- computations ----------
  function monthTx(key) { return state.txs.filter((t) => t.date.startsWith(key)); }
  function sums(list) { let i = 0, o = 0; for (const t of list) { if (t.type === "in") i += t.amount; else if (t.type === "out") o += t.amount; } return { i, o }; }
  function accountEffects(t) {
    const a = accIdOf(t);
    switch (t.type) {
      case "in": return [[a, t.amount]];
      case "out": return [[a, -t.amount]];
      case "transfer": return [[a, -t.amount], [t.to, t.amount]];
      default: return a ? [[a, t.dir * t.amount]] : [];
    }
  }
  function balances() {
    const b = {};
    for (const a of state.settings.accounts) b[a.id] = a.initial;
    for (const t of state.txs) for (const [id, v] of accountEffects(t)) if (b[id] !== undefined) b[id] += v;
    return b;
  }
  function goalSaved(g) { return g.initial + state.txs.filter((t) => t.type === "save" && t.goal === g.id).reduce((s, t) => s - t.dir * t.amount, 0); }
  function debtPaid(d) { return state.txs.filter((t) => t.type === "debt" && t.debt === d.id && t.role === "pay").reduce((s, t) => s + t.amount, 0); }
  function debtLeft(d) { return Math.max(0, d.amount - debtPaid(d)); }

  // ---------- navigation ----------
  function setView(v) {
    state.view = v;
    window.scrollTo({ top: 0 });
    render();
  }
  function renderShell() {
    const top = SUBVIEWS[state.view] ? "more" : state.view;
    $("tabbar").innerHTML = `<div class="brand"><span>${ico("wallet")}</span>Carnet</div>` + VIEWS.map(([id, icon, name]) =>
      `<button type="button" class="tab" data-nav="${id}" ${top === id ? 'aria-current="page"' : ""}>${ico(icon)}<span>${name}</span></button>`).join("");
    document.querySelectorAll("[data-view]").forEach((s) => (s.hidden = s.dataset.view !== state.view));
    $("view-title").textContent = SUBVIEWS[state.view] || VIEWS.find((v) => v[0] === state.view)[2];
    $("back").hidden = !SUBVIEWS[state.view];
    $("monthnav").hidden = !["ops", "cats", "stats"].includes(state.view);
    $("month-label").textContent = monthName(state.month);
    $("fab").hidden = state.view === "more";
  }
  $("tabbar").addEventListener("click", (e) => { const b = e.target.closest("[data-nav]"); if (b) setView(b.dataset.nav); });
  $("back").addEventListener("click", () => setView("more"));
  const goMonth = (d) => { state.month = shiftMonth(state.month, d); state.filter = null; render(); };
  $("prev").addEventListener("click", () => goMonth(-1));
  $("next").addEventListener("click", () => goMonth(1));

  // ---------- render ----------
  function render() {
    if (!state.settings) return;
    renderShell();
    const v = state.view;
    if (v === "ops") renderOps();
    else if (v === "accounts") renderAccounts();
    else if (v === "cats") renderCats();
    else if (v === "stats") renderStats();
    else if (v === "more") renderMore();
    else if (v === "savings") renderSavings();
    else if (v === "debts") renderDebts();
  }

  function renderOps() {
    const list = monthTx(state.month);
    const { i, o } = sums(list);
    const bal = i - o;
    $("t-balance").textContent = money(bal, true);
    $("t-balance").className = "num " + (bal < 0 ? "neg" : bal > 0 ? "pos" : "");
    $("t-in").textContent = money(i); $("t-out").textContent = money(o);
    renderBudget(o);
    renderJournal();
  }

  function renderBudget(spent) {
    const b = state.settings.budget;
    const el = $("budget");
    if (!b) {
      el.innerHTML = `<div class="row-between"><span class="label">Budget</span><button type="button" class="linkish" id="set-budget">Fixer un budget mensuel</button></div>`;
      $("set-budget").onclick = () => openSettings("money");
      return;
    }
    const pct = spent / b;
    const cls = pct > 1 ? "over" : pct >= 0.8 ? "warn" : "";
    const status = pct > 1 ? `Dépassé de ${money(spent - b)}` : `Reste ${money(b - spent)}`;
    el.innerHTML = `<div class="row-between"><span><span class="label">Budget</span> <span class="num">${money(spent)} / ${money(b)}</span></span><span class="pill ${cls}">${status}</span></div>
      <div class="gauge ${cls}" role="meter" aria-valuemin="0" aria-valuemax="${b}" aria-valuenow="${spent}" aria-label="Budget utilisé"><span style="width:${Math.min(100, pct * 100).toFixed(1)}%"></span></div>`;
  }

  function txView(t) {
    const c = catOf(t.cat);
    const accId = accIdOf(t);
    const a = accId ? accOf(accId) : null;
    let title = c.name, sub = "", amt, cls = "neutral", icon = c.icon, color = c.color;
    if (t.type === "in" || t.type === "out") {
      sub = `${t.note ? t.note + " · " : ""}${a.name}`;
      amt = money(t.type === "in" ? t.amount : -t.amount, true); cls = t.type === "in" ? "pos" : "neg";
    } else if (t.type === "transfer") {
      sub = `${a.name} → ${accOf(t.to).name}${t.note ? " · " + t.note : ""}`; amt = money(t.amount);
    } else if (t.type === "adjust") {
      sub = `${a.name}${t.note ? " · " + t.note : ""}`; amt = money(t.dir * t.amount, true);
    } else if (t.type === "save") {
      const g = goalOf(t.goal);
      title = t.dir < 0 ? `Épargne : ${g ? g.name : "objectif supprimé"}` : `Retrait d'épargne : ${g ? g.name : "objectif supprimé"}`;
      sub = `${t.dir < 0 ? "Depuis" : "Vers"} ${a.name}${t.note ? " · " + t.note : ""}`; amt = money(t.dir * t.amount, true);
      if (g) { icon = g.icon; color = g.color; }
    } else if (t.type === "debt") {
      const d = debtOf(t.debt);
      const who = d ? d.person : "dette supprimée";
      const owe = d ? d.kind === "owe" : t.dir > 0;
      title = t.role === "init" ? (owe ? `Emprunt auprès de ${who}` : `Prêt à ${who}`) : (owe ? `Remboursement à ${who}` : `Remboursement de ${who}`);
      sub = `${a ? a.name : "Hors comptes"}${t.note ? " · " + t.note : ""}`;
      amt = a ? money(t.dir * t.amount, true) : money(t.amount);
    }
    return { title, sub, amt, cls, icon, color };
  }

  function renderJournal() {
    const all = monthTx(state.month).filter((t) => !state.accFilter || accIdOf(t) === state.accFilter || t.to === state.accFilter);
    const used = [...new Set(all.map((t) => t.cat))];
    if (state.filter && !used.includes(state.filter)) state.filter = null;
    let chips = "";
    if (state.accFilter) { const a = accOf(state.accFilter); chips += `<button type="button" class="chip" data-clear-acc aria-label="Retirer le filtre de compte" aria-pressed="true">${ico(a.icon)}${esc(a.name)} ✕</button>`; }
    if (used.length > 1) {
      chips += `<button type="button" class="chip" data-filter="" aria-pressed="${!state.filter}">Tout</button>` +
        used.map((id) => { const c = catOf(id); return `<button type="button" class="chip" data-filter="${esc(id)}" aria-pressed="${state.filter === id}"><span style="color:var(${c.color})">${ico(c.icon)}</span>${esc(c.name)}</button>`; }).join("");
    }
    $("filters").innerHTML = chips;
    $("filters").hidden = !chips;
    const list = all.filter((t) => !state.filter || t.cat === state.filter)
      .sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created);
    $("journal-count").textContent = list.length ? plural(list.length, "opération") : "";
    if (!list.length) {
      const any = state.txs.length > 0;
      $("journal").innerHTML = `<div class="empty">${ico("receipt")}<p>${any ? `Aucune opération en ${monthName(state.month)}${state.accFilter ? " sur ce compte" : ""}.` : "Ton carnet est vide. Ajoute ta première dépense avec le bouton +, ou charge quelques exemples pour voir le carnet rempli."}</p>${any ? "" : `<button type="button" class="btn small" id="load-samples">Charger des exemples</button>`}</div>`;
      return;
    }
    const byDay = new Map();
    for (const t of list) { if (!byDay.has(t.date)) byDay.set(t.date, []); byDay.get(t.date).push(t); }
    let html = "";
    for (const [day, txs] of byDay) {
      const [y, m, d] = day.split("-").map(Number);
      const label = new Date(y, m - 1, d).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
      const net = txs.reduce((s, t) => s + (t.type === "in" ? t.amount : t.type === "out" ? -t.amount : 0), 0);
      html += `<div class="day"><div class="day-head"><span>${label}</span><span class="num">${net ? money(net, true) : ""}</span></div>`;
      for (const t of txs) {
        const v = txView(t);
        html += `<button type="button" class="tx" data-id="${esc(t.id)}" aria-label="Ouvrir : ${esc(v.title)} ${esc(money(t.amount))}">
          <span class="badge" style="${tint(v.color)}">${ico(v.icon)}</span>
          <span class="what"><b>${esc(v.title)}${t.sample ? '<span class="tag">exemple</span>' : ""}</b><span>${esc(v.sub) || "&nbsp;"}</span></span>
          <span class="amt ${v.cls}">${v.amt}</span></button>`;
      }
      html += `</div>`;
    }
    $("journal").innerHTML = html;
  }
  $("filters").addEventListener("click", (e) => {
    const b = e.target.closest("[data-filter]");
    if (b) { state.filter = b.dataset.filter || null; renderJournal(); return; }
    if (e.target.closest("[data-clear-acc]")) { state.accFilter = null; render(); }
  });
  $("journal").addEventListener("click", async (e) => {
    if (e.target.closest("#load-samples")) { if (store) await loadSamples(); return; }
    const row = e.target.closest("[data-id]"); if (row) openTx(row.dataset.id);
  });

  function renderAccounts() {
    const b = balances();
    const list = activeAccs();
    const accTotal = list.reduce((s, a) => s + b[a.id], 0);
    const saved = state.plans.goals.reduce((s, g) => s + goalSaved(g), 0);
    const lent = state.plans.debts.filter((d) => d.kind === "lent").reduce((s, d) => s + debtLeft(d), 0);
    const owed = state.plans.debts.filter((d) => d.kind === "owe").reduce((s, d) => s + debtLeft(d), 0);
    const net = accTotal + saved + lent - owed;
    $("worth").innerHTML = `<span class="label">Patrimoine net</span><span class="num big ${net < 0 ? "neg" : ""}">${money(net)}</span>
      <div class="worth-rows">
        <div><span>Sur mes comptes</span><span class="num">${money(accTotal)}</span></div>
        <div><span>Épargne mise de côté</span><span class="num">${money(saved)}</span></div>
        <div><span>On me doit</span><span class="num pos">${money(lent, true)}</span></div>
        <div><span>Je dois</span><span class="num neg">${money(-owed, true)}</span></div>
      </div>`;
    $("acc-list").innerHTML = list.map((a) => {
      const n = state.txs.filter((t) => accIdOf(t) === a.id || t.to === a.id).length;
      return `<div class="item">
        <span class="badge" style="background:var(--accent-soft);color:var(--accent)">${ico(a.icon)}</span>
        <b>${esc(a.name)}</b><span class="num ${b[a.id] < 0 ? "neg" : ""}" style="font-size:1.05rem">${money(b[a.id])}</span>
        <span class="note" style="grid-column:2/-1">${plural(n, "opération")}${a.id === state.settings.defaultAccount ? " · compte par défaut" : ""}</span>
        <div class="item-actions">
          <button type="button" class="btn small" data-acc-ops="${esc(a.id)}">${ico("list")}Opérations</button>
          <button type="button" class="btn small" data-acc-adjust="${esc(a.id)}">${ico("sliders-horizontal")}Ajuster le solde</button>
        </div></div>`;
    }).join("");
  }
  $("acc-list").addEventListener("click", (e) => {
    let b;
    if ((b = e.target.closest("[data-acc-ops]"))) { state.accFilter = b.dataset.accOps; state.filter = null; setView("ops"); }
    else if ((b = e.target.closest("[data-acc-adjust]"))) openAdjust(b.dataset.accAdjust);
  });
  $("manage-accounts").addEventListener("click", () => openSettings("accounts"));

  function renderCats() {
    document.querySelectorAll("#catview-seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.catview === state.catView)));
    const type = state.catView;
    const list = monthTx(state.month).filter((t) => t.type === type);
    const by = {}; const count = {};
    for (const t of list) { by[t.cat] = (by[t.cat] || 0) + t.amount; count[t.cat] = (count[t.cat] || 0) + 1; }
    const total = list.reduce((s, t) => s + t.amount, 0);
    const cats = activeCats(type).concat(Object.keys(by).filter((id) => !activeCats(type).some((c) => c.id === id)).map(catOf));
    cats.sort((a, b) => (by[b.id] || 0) - (by[a.id] || 0));
    $("cat-summary").textContent = `${type === "out" ? "Dépensé" : "Reçu"} en ${monthName(state.month)} : ${money(total)}`;
    $("cat-list").innerHTML = cats.map((c) => {
      const v = by[c.id] || 0;
      const cap = type === "out" ? c.cap : 0;
      const pct = cap ? v / cap : total ? v / total : 0;
      const gcls = cap ? (pct > 1 ? "over" : pct >= 0.8 ? "warn" : "") : "";
      const right = cap ? `<span class="pill ${gcls}">${pct > 1 ? "Dépassé" : `${Math.round(pct * 100)} %`}</span>` : `<span class="note">${total ? Math.round(pct * 100) : 0} %</span>`;
      return `<button type="button" class="item" data-cat-open="${esc(c.id)}">
        <span class="badge" style="${tint(c.color)}">${ico(c.icon)}</span>
        <b>${esc(c.name)}</b><span class="num">${money(v)}</span>
        <span class="item-sub"><span class="row-between"><span class="note">${plural(count[c.id] || 0, "opération")}${cap ? ` · plafond ${money(cap)}` : ""}</span>${right}</span>
        <span class="gauge ${gcls}"><span style="width:${Math.min(100, pct * 100).toFixed(1)}%;${gcls ? "" : `background:var(${c.color})`}"></span></span></span></button>`;
    }).join("");
  }
  $("catview-seg").addEventListener("click", (e) => { const b = e.target.closest("[data-catview]"); if (b) { state.catView = b.dataset.catview; renderCats(); } });
  $("cat-list").addEventListener("click", (e) => { const b = e.target.closest("[data-cat-open]"); if (b) { state.filter = b.dataset.catOpen; state.accFilter = null; setView("ops"); } });
  $("manage-cats").addEventListener("click", () => openSettings("cats"));

  function renderStats() {
    const list = monthTx(state.month);
    const { i, o } = sums(list);
    const [y, m] = state.month.split("-").map(Number);
    const daysInMonth = new Date(y, m, 0).getDate();
    const isCurrent = state.month === monthKey(new Date());
    const days = isCurrent ? new Date().getDate() : daysInMonth;
    const rate = i ? (i - o) / i : null;
    $("kpis").innerHTML = [
      ["Revenus", money(i), "pos"], ["Dépenses", money(o), "neg"],
      ["Taux d'épargne", rate === null ? "—" : `${Math.round(rate * 100)} %`, rate !== null && rate < 0 ? "neg" : ""],
      ["Dépense moyenne par jour", money(o / days), ""],
    ].map(([l, v, c]) => `<div class="kpi"><span class="label">${l}</span><span class="num ${c}">${v}</span></div>`).join("");
    renderBreakdown(list);
    renderTrend();
    const top = list.filter((t) => t.type === "out").sort((a, b) => b.amount - a.amount).slice(0, 5);
    $("top").innerHTML = top.length ? top.map((t) => { const v = txView(t); return `<button type="button" class="tx" data-id="${esc(t.id)}">
        <span class="badge" style="${tint(v.color)}">${ico(v.icon)}</span>
        <span class="what"><b>${esc(v.title)}</b><span>${esc(longDate(t.date))}${t.note ? " · " + esc(t.note) : ""}</span></span>
        <span class="amt neg">${money(t.amount)}</span></button>`; }).join("") : `<p class="note">Aucune dépense ce mois-ci.</p>`;
  }
  $("top").addEventListener("click", (e) => { const r = e.target.closest("[data-id]"); if (r) openTx(r.dataset.id); });

  function renderBreakdown(list) {
    const out = list.filter((t) => t.type === "out");
    const total = out.reduce((s, t) => s + t.amount, 0);
    if (!total) { $("breakdown").innerHTML = `<p class="note">Les dépenses du mois apparaîtront ici, réparties par catégorie.</p>`; return; }
    const by = {};
    for (const t of out) by[t.cat] = (by[t.cat] || 0) + t.amount;
    const rows = Object.entries(by).sort((a, b) => b[1] - a[1]);
    const R = 60, C = 2 * Math.PI * R;
    let acc = 0, arcs = "";
    for (const [cat, v] of rows) {
      const len = (v / total) * C;
      arcs += `<circle r="${R}" cx="80" cy="80" fill="none" stroke="var(${catOf(cat).color})" stroke-width="22" stroke-dasharray="${Math.max(len - 1.5, 0.5)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 80 80)"><title>${esc(catOf(cat).name)}</title></circle>`;
      acc += len;
    }
    const legend = rows.map(([id, v]) => {
      const c = catOf(id);
      return `<li><span style="color:var(${c.color})">${ico(c.icon)}</span><span>${esc(c.name)} <small>${Math.round((v / total) * 100)} %</small></span><span class="num">${money(v)}</span>
        <span class="bar"><span style="width:${((v / rows[0][1]) * 100).toFixed(1)}%;background:var(${c.color})"></span></span></li>`;
    }).join("");
    $("breakdown").innerHTML = `<div class="donut-wrap"><svg viewBox="0 0 160 160" role="img" aria-label="Répartition des dépenses">
        <circle r="${R}" cx="80" cy="80" fill="none" stroke="var(--surface-2)" stroke-width="22"></circle>${arcs}
        <text x="80" y="76" text-anchor="middle" fill="var(--muted)" font-size="10" font-family="var(--f-body)">Dépenses</text>
        <text x="80" y="94" text-anchor="middle" fill="var(--ink)" font-size="15" font-family="var(--f-num)">${esc(compact(total))}</text>
      </svg><ul class="legend">${legend}</ul></div>`;
  }

  function renderTrend() {
    const keys = []; for (let k = 5; k >= 0; k--) keys.push(shiftMonth(state.month, -k));
    const data = keys.map((k) => ({ k, ...sums(monthTx(k)) }));
    const max = Math.max(...data.map((d) => Math.max(d.i, d.o)));
    if (!max) { $("trend").innerHTML = `<p class="note">Rien à comparer pour l'instant.</p>`; return; }
    const W = 600, H = 210, L = 48, B = 26, T = 14, plotH = H - B - T, slot = (W - L) / 6, bw = Math.min(26, slot / 3.2);
    const y = (v) => T + plotH - (v / max) * plotH;
    const tick = (v, lbl) => `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-num)">${lbl}</text>`;
    let g = `<line x1="${L}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
      <line x1="${L}" x2="${W}" y1="${y(max)}" y2="${y(max)}" stroke="var(--line)" stroke-dasharray="3 4"/>
      <line x1="${L}" x2="${W}" y1="${y(max / 2)}" y2="${y(max / 2)}" stroke="var(--line)" stroke-dasharray="3 4"/>
      ${tick(max, esc(compact(max)))}${tick(max / 2, esc(compact(max / 2)))}${tick(0, "0")}`;
    data.forEach((d, idx) => {
      const cx = L + slot * idx + slot / 2;
      const cur = d.k === state.month;
      g += `<rect x="${cx - bw - 2}" y="${y(d.i)}" width="${bw}" height="${Math.max(y(0) - y(d.i), d.i ? 1 : 0)}" rx="3" fill="var(--in)" opacity="${cur ? 1 : 0.55}"><title>Revenus ${esc(money(d.i))}</title></rect>`;
      g += `<rect x="${cx + 2}" y="${y(d.o)}" width="${bw}" height="${Math.max(y(0) - y(d.o), d.o ? 1 : 0)}" rx="3" fill="var(--out)" opacity="${cur ? 1 : 0.55}"><title>Dépenses ${esc(money(d.o))}</title></rect>`;
      g += `<text x="${cx}" y="${H - 6}" text-anchor="middle" font-size="12" fill="${cur ? "var(--ink)" : "var(--muted)"}" font-weight="${cur ? 600 : 400}" font-family="var(--f-body)">${esc(monthName(d.k, { month: "short" }))}</text>`;
    });
    $("trend").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenus et dépenses des six derniers mois">${g}</svg>`;
  }

  function renderMore() {
    const saved = state.plans.goals.reduce((s, g) => s + goalSaved(g), 0);
    const openDebts = state.plans.debts.filter((d) => debtLeft(d) > 0);
    const owed = openDebts.filter((d) => d.kind === "owe").reduce((s, d) => s + debtLeft(d), 0);
    const lent = openDebts.filter((d) => d.kind === "lent").reduce((s, d) => s + debtLeft(d), 0);
    const items = [
      ["savings", "piggy-bank", "--c2", "Épargne", state.plans.goals.length ? `${plural(state.plans.goals.length, "objectif")} · ${money(saved)} mis de côté` : "Crée un objectif et mets de l'argent de côté"],
      ["debts", "handshake", "--c1", "Dettes", openDebts.length ? `Je dois ${money(owed)} · On me doit ${money(lent)}` : "Suis ce que tu dois et ce qu'on te doit"],
      ["statement", "file-text", "--c3", "Relevé PDF", "Un relevé imprimable par mois, par période ou par compte"],
      ["settings", "settings", "--c10", "Paramètres", "Thème, devise, budget, catégories, comptes"],
      ["export", "download", "--c8", "Exporter en CSV", "Toutes tes opérations dans un fichier Excel"],
      ["sync", store?.mode === "sync" ? "cloud" : "hard-drive", "--c5", "Synchronisation", store?.mode === "sync" ? "Synchronisé avec ton compte" : "Enregistré sur cet appareil"],
    ];
    $("more-menu").innerHTML = items.map(([id, icon, color, title, sub]) => `<button type="button" data-more="${id}">
      <span class="badge" style="${tint(color)}">${ico(icon)}</span><span class="what"><b>${title}</b><span>${esc(sub)}</span></span><span class="chev">${ico("chevron-right")}</span></button>`).join("");
  }
  $("more-menu").addEventListener("click", (e) => {
    const b = e.target.closest("[data-more]"); if (!b) return;
    const id = b.dataset.more;
    if (id === "savings" || id === "debts") setView(id);
    else if (id === "settings") openSettings("appearance");
    else if (id === "sync") openSettings("sync");
    else if (id === "export") exportCsv();
    else if (id === "statement") openStatement();
  });

  // ---------- savings ----------
  function renderSavings() {
    const goals = state.plans.goals;
    const total = goals.reduce((s, g) => s + goalSaved(g), 0);
    const target = goals.reduce((s, g) => s + g.target, 0);
    $("savings-head").innerHTML = `<div class="row-between"><span class="label">Total mis de côté</span><button type="button" class="btn small primary" id="new-goal">${ico("plus")}Nouvel objectif</button></div>
      <span class="num big">${money(total)}</span>${target ? `<span class="note">sur ${money(target)} d'objectifs</span>` : ""}`;
    if (!goals.length) {
      $("goal-list").innerHTML = `<div class="panel empty">${ico("piggy-bank")}<p>Crée un objectif (fonds d'urgence, voyage, voiture…) puis mets de l'argent de côté depuis tes comptes. L'argent épargné quitte le compte et s'ajoute à l'objectif.</p></div>`;
      return;
    }
    $("goal-list").innerHTML = goals.map((g) => {
      const s = goalSaved(g);
      const pct = g.target ? Math.min(1, s / g.target) : 0;
      let plan = "";
      if (g.target && s < g.target && g.deadline) {
        const now = new Date(); const [y, m] = g.deadline.split("-").map(Number);
        const months = Math.max(1, (y - now.getFullYear()) * 12 + (m - 1 - now.getMonth()));
        plan = ` · ${money((g.target - s) / months)} par mois pour y arriver`;
      }
      const done = g.target && s >= g.target;
      return `<div class="item">
        <span class="badge" style="${tint(g.color)}">${ico(g.icon)}</span>
        <b>${esc(g.name)}${g.sample ? '<span class="tag">exemple</span>' : ""}</b><span class="num">${money(s)}</span>
        <span class="item-sub">
          <span class="row-between"><span class="note">${g.target ? `Objectif ${money(g.target)}` : "Sans montant cible"}${g.deadline ? ` · avant le ${longDate(g.deadline)}` : ""}${plan}</span>${done ? '<span class="pill">Atteint</span>' : g.target ? `<span class="pill muted">${Math.round(pct * 100)} %</span>` : ""}</span>
          ${g.target ? `<span class="gauge ${done ? "good" : ""}"><span style="width:${(pct * 100).toFixed(1)}%;${done ? "" : `background:var(${g.color})`}"></span></span>` : ""}
        </span>
        <div class="item-actions">
          <button type="button" class="btn small primary" data-goal-add="${g.id}">${ico("plus")}Mettre de côté</button>
          <button type="button" class="btn small" data-goal-take="${g.id}">${ico("minus")}Retirer</button>
          <button type="button" class="btn small" data-goal-edit="${g.id}">${ico("pencil")}Modifier</button>
        </div></div>`;
    }).join("");
  }
  $("savings-head").addEventListener("click", (e) => { if (e.target.closest("#new-goal")) openGoal(); });
  $("goal-list").addEventListener("click", (e) => {
    let b;
    if ((b = e.target.closest("[data-goal-add]"))) openGoalMove(b.dataset.goalAdd, -1);
    else if ((b = e.target.closest("[data-goal-take]"))) openGoalMove(b.dataset.goalTake, 1);
    else if ((b = e.target.closest("[data-goal-edit]"))) openGoal(b.dataset.goalEdit);
  });

  // ---------- debts ----------
  function renderDebts() {
    document.querySelectorAll("#debt-seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.debtview === state.debtView)));
    const all = state.plans.debts;
    const owed = all.filter((d) => d.kind === "owe").reduce((s, d) => s + debtLeft(d), 0);
    const lent = all.filter((d) => d.kind === "lent").reduce((s, d) => s + debtLeft(d), 0);
    $("debt-kpis").innerHTML = `<div class="kpi"><span class="label">Je dois</span><span class="num neg">${money(owed)}</span></div><div class="kpi"><span class="label">On me doit</span><span class="num pos">${money(lent)}</span></div>`;
    const kind = state.debtView;
    const list = all.filter((d) => d.kind === kind).sort((a, b) => (debtLeft(b) > 0) - (debtLeft(a) > 0) || (a.due || "9").localeCompare(b.due || "9"));
    const addBtn = `<button type="button" class="btn primary" id="new-debt">${ico("plus")}${kind === "owe" ? "Ajouter une dette" : "Ajouter un prêt"}</button>`;
    if (!list.length) {
      $("debt-list").innerHTML = `<div class="panel empty">${ico("handshake")}<p>${kind === "owe" ? "Note l'argent que tu as emprunté et suis tes remboursements." : "Note l'argent que tu as prêté et suis ce qu'on te rembourse."}</p>${addBtn}</div>`;
      return;
    }
    const t = today();
    $("debt-list").innerHTML = `<div class="actions">${addBtn}</div>` + list.map((d) => {
      const left = debtLeft(d), paid = d.amount - left, pct = d.amount ? paid / d.amount : 0;
      const settled = left <= 0;
      const late = !settled && d.due && d.due < t;
      const pill = settled ? '<span class="pill">Soldée</span>' : late ? '<span class="pill over">En retard</span>' : d.due ? `<span class="pill muted">Échéance ${longDate(d.due)}</span>` : "";
      return `<div class="item" ${settled ? 'style="opacity:.7"' : ""}>
        <span class="badge" style="${tint(kind === "owe" ? "--c4" : "--c8")}">${ico(kind === "owe" ? "arrow-down-left" : "arrow-up-right")}</span>
        <b>${esc(d.person)}${d.sample ? '<span class="tag">exemple</span>' : ""}</b><span class="num ${settled ? "" : kind === "owe" ? "neg" : "pos"}">${money(left)}</span>
        <span class="item-sub">
          <span class="row-between"><span class="note">${money(paid)} remboursés sur ${money(d.amount)} · depuis le ${longDate(d.date)}${d.note ? " · " + esc(d.note) : ""}</span>${pill}</span>
          <span class="gauge good"><span style="width:${(pct * 100).toFixed(1)}%"></span></span>
        </span>
        <div class="item-actions">
          ${settled ? "" : `<button type="button" class="btn small primary" data-debt-pay="${d.id}">${ico("check")}${kind === "owe" ? "Je rembourse" : "On me rembourse"}</button>`}
          <button type="button" class="btn small" data-debt-edit="${d.id}">${ico("pencil")}Modifier</button>
        </div></div>`;
    }).join("");
  }
  $("debt-seg").addEventListener("click", (e) => { const b = e.target.closest("[data-debtview]"); if (b) { state.debtView = b.dataset.debtview; renderDebts(); } });
  $("debt-list").addEventListener("click", (e) => {
    let b;
    if (e.target.closest("#new-debt")) openDebt(null, state.debtView);
    else if ((b = e.target.closest("[data-debt-pay]"))) openDebtPay(b.dataset.debtPay);
    else if ((b = e.target.closest("[data-debt-edit]"))) openDebt(b.dataset.debtEdit);
  });

  // ---------- sheets: shared open/close ----------
  const openStack = [];
  function showSheet(id) { const el = $(id); el.hidden = false; document.body.style.overflow = "hidden"; openStack.push({ id, focus: document.activeElement }); }
  function hideSheet(id) {
    $(id).hidden = true;
    const i = openStack.findIndex((s) => s.id === id);
    const entry = i >= 0 ? openStack.splice(i, 1)[0] : null;
    if (!openStack.length) document.body.style.overflow = "";
    entry?.focus?.focus?.();
  }
  document.addEventListener("click", (e) => {
    const c = e.target.closest("[data-close]"); if (c) { closeAny(c.dataset.close); return; }
    if (e.target.classList?.contains("sheet")) closeAny(e.target.id);
  });
  function closeAny(id) { if (id === "sheet") closeSettings(false); else if (id === "picker") closePicker(); else hideSheet(id); }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && openStack.length) closeAny(openStack[openStack.length - 1].id); });

  // ---------- operation sheet ----------
  function setType(type, keepCat) {
    state.type = type;
    document.querySelectorAll("#type-seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.type === type)));
    const isT = type === "transfer";
    $("f-to-wrap").hidden = !isT;
    $("f-cats-wrap").hidden = isT;
    $("f-account-label").textContent = isT ? "Depuis le compte" : "Compte";
    if (!isT && (!keepCat || catOf(state.cat).type !== type || catOf(state.cat).archived)) state.cat = activeCats(type)[0]?.id;
    renderCatPicker();
  }
  function renderCatPicker() {
    if (state.type === "transfer") return;
    const list = activeCats(state.type);
    const cur = catIdx[state.cat];
    if (cur && cur.archived && cur.type === state.type) list.push(cur);
    $("f-cats").innerHTML = list.map((c) =>
      `<button type="button" class="chip" data-cat="${esc(c.id)}" aria-pressed="${c.id === state.cat}"><span style="color:var(${c.color})">${ico(c.icon)}</span>${esc(c.name)}</button>`).join("");
  }
  function accountOptions(selected, { none = false, extra = [] } = {}) {
    const list = activeAccs();
    for (const id of extra) if (id && accIdx[id] && !list.includes(accIdx[id])) list.push(accIdx[id]);
    return (none ? `<option value="">Ne pas toucher à mes comptes</option>` : "") +
      list.map((a) => `<option value="${esc(a.id)}" ${a.id === selected ? "selected" : ""}>${esc(a.name)}</option>`).join("");
  }
  function openOp(tx) {
    state.editing = tx ? tx.id : null;
    if (tx && tx.type !== "transfer") state.cat = tx.cat;
    const acc = tx ? accIdOf(tx) : state.accFilter || state.settings.defaultAccount;
    $("f-account").innerHTML = accountOptions(acc, { extra: tx ? [tx.account] : [] });
    const other = activeAccs().find((a) => a.id !== acc);
    $("f-to").innerHTML = accountOptions(tx?.to || other?.id || acc, { extra: tx ? [tx.to] : [] });
    setType(tx ? tx.type : state.type === "transfer" ? "out" : state.type, true);
    $("f-amount").value = tx ? String(tx.amount).replace(".", ",") : "";
    const t = today();
    $("f-date").value = tx ? tx.date : t.startsWith(state.month) ? t : `${state.month}-01`;
    $("f-note").value = tx ? tx.note : "";
    $("form-title").textContent = tx ? "Modifier l'opération" : "Nouvelle opération";
    $("submit-btn").textContent = tx ? "Mettre à jour" : "Ajouter";
    $("delete-btn").hidden = !tx; disarm($("delete-btn"));
    showSheet("op-sheet");
    setTimeout(() => $("f-amount").focus(), 30);
  }
  function disarm(b) { b.classList.remove("armed"); b.textContent = b.dataset.label || "Supprimer"; }
  function armOrRun(b, fn) {
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Confirmer la suppression"; return; }
    fn();
  }
  $("fab").addEventListener("click", () => store ? openOp(null) : toast("Un instant, le carnet se charge…"));
  $("add-desktop").addEventListener("click", () => store ? openOp(null) : toast("Un instant, le carnet se charge…"));
  $("type-seg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setType(b.dataset.type); });
  $("f-cats").addEventListener("click", (e) => { const b = e.target.closest("[data-cat]"); if (!b) return; state.cat = b.dataset.cat; renderCatPicker(); });
  $("tx-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!store) return;
    const amount = parseAmount($("f-amount").value);
    if (!(amount > 0)) { toast("Indique un montant supérieur à zéro."); $("f-amount").focus(); return; }
    const date = $("f-date").value;
    if (!date) { toast("Choisis une date."); return; }
    const account = $("f-account").value;
    const isT = state.type === "transfer";
    const to = isT ? $("f-to").value : "";
    if (isT && to === account) { toast("Choisis deux comptes différents pour un transfert."); return; }
    if (!isT && !state.cat) { toast("Choisis une catégorie."); return; }
    const prev = state.editing && state.txs.find((t) => t.id === state.editing);
    const tx = {
      id: state.editing || newId(), type: state.type, amount, cat: isT ? "transfer" : state.cat, account, to, dir: 1, goal: "", debt: "", role: "pay", date,
      note: $("f-note").value.trim().slice(0, 120), sample: prev ? prev.sample : false, created: prev ? prev.created : Date.now(),
    };
    try { await store.saveTx(tx); } catch (err) { return; }
    toast(prev ? "Opération mise à jour" : ({ out: "Dépense ajoutée", in: "Revenu ajouté", transfer: "Transfert enregistré" })[tx.type]);
    if (!date.startsWith(state.month)) { state.month = date.slice(0, 7); render(); }
    hideSheet("op-sheet");
  });
  $("delete-btn").addEventListener("click", (e) => armOrRun(e.currentTarget, async () => {
    try { await store.deleteTx(state.editing); } catch (err) { return; }
    toast("Opération supprimée"); hideSheet("op-sheet");
  }));

  function openTx(id) {
    const tx = state.txs.find((t) => t.id === id);
    if (!tx) return;
    if (["in", "out", "transfer"].includes(tx.type)) { openOp(tx); return; }
    const v = txView(tx);
    openModal({
      title: v.title,
      html: `<div class="info"><p><b>Montant :</b> <span class="num">${money(tx.amount)}</span></p><p><b>Date :</b> ${longDate(tx.date)}</p><p><b>Compte :</b> ${esc(v.sub) || "—"}</p></div>
        <p class="note">${tx.type === "adjust" ? "Un ajustement corrige le solde d'un compte sans compter comme revenu ou dépense." : tx.type === "save" ? "Ce mouvement se gère depuis Plus › Épargne." : "Ce mouvement se gère depuis Plus › Dettes."} Tu peux le supprimer ici si c'était une erreur.</p>`,
      submit: null,
      danger: { label: "Supprimer ce mouvement", run: async () => { await store.deleteTx(id); toast("Mouvement supprimé"); } },
    });
  }

  // ---------- generic modal ----------
  let modalSubmit = null, modalDanger = null;
  function openModal({ title, html, submit = "Enregistrer", onSubmit, danger }) {
    $("modal-title").textContent = title;
    $("modal-form").innerHTML = html + '<button type="submit" hidden></button>';
    $("modal-submit").hidden = !submit;
    $("modal-submit").textContent = submit || "";
    modalSubmit = onSubmit || null;
    modalDanger = danger || null;
    onSegChange = null;
    const d = $("modal-danger");
    d.hidden = !danger; d.dataset.label = danger?.label || ""; disarm(d);
    showSheet("modal");
    setTimeout(() => $("modal-form").querySelector("input, select")?.focus(), 30);
  }
  $("modal-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!modalSubmit || !store) return;
    try { if ((await modalSubmit(new FormData($("modal-form")))) === false) return; } catch (err) { return; }
    hideSheet("modal");
  });
  $("modal-danger").addEventListener("click", (e) => armOrRun(e.currentTarget, async () => {
    if (!modalDanger || !store) return;
    try { await modalDanger.run(); } catch (err) { return; }
    hideSheet("modal");
  }));
  $("modal-form").addEventListener("click", (e) => {
    const b = e.target.closest("[data-seg-value]"); if (!b) return;
    const grp = b.closest("[data-seg-name]");
    grp.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    $("modal-form").querySelector(`input[name="${grp.dataset.segName}"]`).value = b.dataset.segValue;
    onSegChange?.(b.dataset.segValue);
  });
  let onSegChange = null;
  const segHtml = (name, value, opts) => `<input type="hidden" name="${name}" value="${value}"><div class="seg" data-seg-name="${name}" role="group">${opts.map(([v, l]) => `<button type="button" data-seg-value="${v}" aria-pressed="${v === value}">${l}</button>`).join("")}</div>`;
  const amountField = (name, label, value = "") => `<div class="field"><label for="m-${name}">${label}</label><input id="m-${name}" name="${name}" class="big" inputmode="decimal" autocomplete="off" placeholder="0" value="${value}"></div>`;

  // ---------- adjust ----------
  function openAdjust(accId) {
    const a = accOf(accId);
    const cur = balances()[accId] || 0;
    openModal({
      title: `Ajuster : ${a.name}`,
      html: `<p class="note">Indique ce qu'il y a vraiment sur le compte. La différence est enregistrée comme un ajustement, qui ne compte ni comme revenu ni comme dépense.</p>
        <div class="info"><p>Solde dans le carnet : <b class="num">${money(cur)}</b></p></div>
        <div class="fields">${amountField("real", "Solde réel")}<div class="field"><label for="m-date">Date</label><input id="m-date" name="date" type="date" value="${today()}"></div>
        <div class="field wide"><label for="m-note">Note</label><input id="m-note" name="note" maxlength="120" placeholder="Frais bancaires, oubli…"></div></div>`,
      submit: "Ajuster",
      onSubmit: async (f) => {
        const real = parseAmount(f.get("real"));
        if (!isFinite(real)) { toast("Indique le solde réel du compte."); return false; }
        const diff = Math.round((real - cur) * 100) / 100;
        if (!diff) { toast("Le solde est déjà juste."); return; }
        await store.saveTx({ id: newId(), type: "adjust", amount: Math.abs(diff), cat: "adjust", account: accId, to: "", dir: diff > 0 ? 1 : -1, goal: "", debt: "", role: "pay", date: f.get("date") || today(), note: String(f.get("note") || "").trim().slice(0, 120), sample: false, created: Date.now() });
        toast(`Solde ajusté (${money(diff, true)})`);
      },
    });
  }

  // ---------- goal modals ----------
  function openGoal(id) {
    const g = id ? goalOf(id) : null;
    const used = new Set(state.plans.goals.map((x) => x.color));
    const color = g ? g.color : PALETTE.find((p) => !used.has(p)) || "--c2";
    const icon = g ? g.icon : "piggy-bank";
    openModal({
      title: g ? "Modifier l'objectif" : "Nouvel objectif d'épargne",
      html: `<div class="fields">
          <div class="field wide"><label for="m-name">Nom</label><input id="m-name" name="name" maxlength="60" placeholder="Fonds d'urgence, voyage, voiture…" value="${esc(g?.name || "")}"></div>
          ${amountField("target", "Montant visé", g?.target || "")}
          <div class="field"><label for="m-deadline">Date visée (facultatif)</label><input id="m-deadline" name="deadline" type="date" value="${g?.deadline || ""}"></div>
          ${g ? "" : amountField("initial", "Déjà mis de côté (facultatif)")}
          <div class="field wide"><span class="flabel">Icône</span><input type="hidden" name="icon" value="${icon}">
            <div class="cats" id="goal-icons">${GOAL_ICONS.map((n) => `<button type="button" class="chip" data-goal-icon="${n}" aria-pressed="${n === icon}" aria-label="${n}" style="padding:7px 9px"><span style="color:var(${color})">${ico(n)}</span></button>`).join("")}</div></div>
        </div>${g ? `<p class="note">Supprimer l'objectif efface aussi ses mouvements : l'argent revient sur les comptes d'origine.</p>` : ""}`,
      submit: g ? "Enregistrer" : "Créer l'objectif",
      onSubmit: async (f) => {
        const name = String(f.get("name") || "").trim();
        if (!name) { toast("Donne un nom à l'objectif."); return false; }
        const target = parseAmount(f.get("target"));
        const goals = state.plans.goals.map((x) => ({ ...x }));
        const data = { name, target: target > 0 ? target : 0, deadline: f.get("deadline") || "", icon: f.get("icon") || "piggy-bank" };
        if (g) Object.assign(goals.find((x) => x.id === g.id), data);
        else { const init = parseAmount(f.get("initial")); goals.push({ id: "g-" + newId(), color, initial: init > 0 ? init : 0, sample: false, created: Date.now(), ...data }); }
        await store.savePlans({ ...state.plans, goals });
        toast(g ? "Objectif mis à jour" : "Objectif créé");
      },
      danger: g ? { label: "Supprimer l'objectif", run: async () => {
        for (const t of state.txs.filter((t) => t.type === "save" && t.goal === g.id)) await store.deleteTx(t.id);
        await store.savePlans({ ...state.plans, goals: state.plans.goals.filter((x) => x.id !== g.id) });
        toast("Objectif supprimé");
      } } : null,
    });
    $("goal-icons").addEventListener("click", (e) => {
      const b = e.target.closest("[data-goal-icon]"); if (!b) return;
      $("goal-icons").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      $("modal-form").querySelector('input[name="icon"]').value = b.dataset.goalIcon;
    });
  }
  function openGoalMove(id, dir) {
    const g = goalOf(id); if (!g) return;
    const saved = goalSaved(g);
    openModal({
      title: dir < 0 ? `Mettre de côté : ${g.name}` : `Retirer de : ${g.name}`,
      html: `<div class="info"><p>Déjà épargné : <b class="num">${money(saved)}</b>${g.target ? ` sur ${money(g.target)}` : ""}</p></div>
        <div class="fields">${amountField("amount", "Montant", dir < 0 && g.target > saved ? "" : "")}
          <div class="field"><label for="m-acc">${dir < 0 ? "Depuis le compte" : "Vers le compte"}</label><select id="m-acc" name="account">${accountOptions(state.settings.defaultAccount)}</select></div>
          <div class="field"><label for="m-date">Date</label><input id="m-date" name="date" type="date" value="${today()}"></div>
          <div class="field"><label for="m-note">Note</label><input id="m-note" name="note" maxlength="120"></div></div>`,
      submit: dir < 0 ? "Mettre de côté" : "Retirer",
      onSubmit: async (f) => {
        const amount = parseAmount(f.get("amount"));

  function removeItem(kind, id) {

    if (used) item.archived = true; else arr.splice(arr.indexOf(item), 1);

  // ---------- PDF statement ----------

  let pdfLib = null;
  function loadScript(src) {

  }
  function getJsPDF() {

  const pdfText = (s) => String(s ?? "").replace(/[   ]/g, " ").replace(/−/g, "-").replace(/→/g, "->").replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[^\x00-\xFF€…–—œŒ]/g, "");

  function openStatement() {
    if (!store) { toast("Un instant, le carnet se charge…"); return; }

      title: "Relevé PDF",
      html: `<p class="note">Un document A4 prêt à imprimer : soldes d'ouverture et de clôture, toutes les opérations de la période avec le solde après chaque ligne, puis les dépenses par catégorie.</p>

          <div class="field"><label for="m-from">Du</label><input id="m-from" name="from" type="date" value="${cur}-01"></div>
          <div class="field"><label for="m-to">Au</label><input id="m-to" name="to" type="date" value="${lastDay}"></div>
        </div>

        <label class="radio" style="font-size:.9rem;color:var(--ink)"><input type="checkbox" name="cats" checked> Inclure les dépenses par catégorie</label>
        <label class="radio" style="font-size:.9rem;color:var(--ink)"><input type="checkbox" name="plans" checked> Inclure l'épargne et les dettes</label>`,
      submit: "Générer le PDF",
      onSubmit: async (f) => {
        const p = f.get("period");
        let from, to;
        if (p === "cur") { from = `${cur}-01`; to = lastDay; }
        else if (p === "prev") { const [py, pmo] = prev.split("-").map(Number); from = `${prev}-01`; to = isoDate(new Date(py, pmo, 0)); }
        else if (p === "year") { from = `${y}-01-01`; to = `${y}-12-31`; }
